<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>notToshu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    position: fixed;
    inset: 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    /* Deep midnight navy — cold and lonely */
    background: #060810;
    background-image:
      radial-gradient(circle at 78% 15%, rgba(180, 190, 230, 0.10), transparent 50%),
      radial-gradient(circle at 25% 85%, rgba(120, 130, 180, 0.06), transparent 55%),
      linear-gradient(to bottom, #0a0e1a 0%, #060810 60%, #03040a 100%);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
  }

  /* Faint moon glow — cold and distant */
  body::before {
    content: "";
    position: fixed;
    top: 12vh;
    right: 15vw;
    width: 34vmin;
    height: 34vmin;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(200, 210, 240, 0.16) 0%,
      rgba(180, 195, 230, 0.09) 30%,
      rgba(150, 170, 210, 0.03) 60%,
      transparent 80%);
    filter: blur(30px);
    pointer-events: none;
    z-index: 0;
    animation: moon-breathe 14s ease-in-out infinite;
  }
  @keyframes moon-breathe {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1;    }
  }

  /* Rain canvas — streaks */
  #rain {
    position: fixed;
    inset: 0;
    width: 100vw; height: 100dvh;
    z-index: 2;
    pointer-events: none;
    display: block;
  }

  /* Petals canvas */
  #petals {
    position: fixed;
    inset: 0;
    width: 100vw; height: 100dvh;
    z-index: 1;
    pointer-events: none;
    display: block;
  }

  /* Mist layer — bottom */
  .mist {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 40vh;
    background: linear-gradient(to top,
      rgba(20, 25, 45, 0.55) 0%,
      rgba(20, 25, 45, 0.28) 40%,
      transparent 100%);
    pointer-events: none;
    z-index: 3;
  }

  .person-wrap {
    position: absolute;
    right: 45%;
    bottom: 0;
    height: 50vh;
    z-index: 5;
    pointer-events: none;
    transform-origin: 50% 100%;
    will-change: transform;
    animation: alive-boy 9s ease-in-out infinite;
  }
  .person {
    height: 100%; width: auto; display: block;
    object-fit: contain; user-select: none;
    filter: brightness(0.72) saturate(0.55) contrast(1.05);
  }
  /* Slower, sadder breathing */
  @keyframes alive-boy {
    0%, 100% { transform: translateY(0)     rotate(0deg)     scale(1); }
    25%      { transform: translateY(-3px)  rotate(-0.45deg) scale(1.004, 1.009); }
    50%      { transform: translateY(-5px)  rotate(0deg)     scale(1.007, 1.015); }
    75%      { transform: translateY(-3px)  rotate(0.45deg)  scale(1.004, 1.009); }
  }

  .person-wrap::before {
    content: "";
    position: absolute;
    inset: -30% -45% -22% -45%;
    background: radial-gradient(
      ellipse 55% 60% at 50% 78%,
      rgba(150, 170, 220, 0.16) 0%,
      rgba(140, 160, 210, 0.10) 18%,
      rgba(130, 150, 200, 0.06) 34%,
      rgba(120, 140, 190, 0.03) 50%,
      rgba(110, 130, 180, 0.015) 66%,
      rgba(100, 120, 170, 0.005) 82%,
      rgba(100, 120, 170, 0)   100%
    );
    filter: blur(30px);
    pointer-events: none;
    z-index: -1;
    animation: glow-breathe 11s ease-in-out infinite;
  }
  @keyframes glow-breathe {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 0.85; }
  }

  .left-stack {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: 14px;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
    white-space: nowrap;
  }

  .eq {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    background: rgba(12, 16, 30, 0.85);
    border: 1px solid rgba(150, 170, 220, 0.18);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .eq-label { font-size: 15px; font-weight: 500; color: #a8b8d8; line-height: 1; }
  #equalizer { display: block; width: 110px; height: 24px; }

  .socials {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    letter-spacing: 0.06em;
    pointer-events: auto;
  }
  .social {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 5px 12px 5px 8px; border-radius: 999px;
    background: rgba(12, 16, 30, 0.85);
    border: 1px solid rgba(150, 170, 220, 0.16);
    color: #c8d0e8; text-decoration: none; font-family: inherit;
    font-size: 14px; line-height: 1; white-space: nowrap;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: color .25s ease, border-color .25s ease, transform .25s ease;
  }
  .social:hover { color: #a8b8d8; border-color: rgba(150, 170, 220, 0.5); transform: translateY(-2px); }
  .social-icon { display: inline-flex; width: 16px; height: 16px; flex-shrink: 0; color: inherit; }
  .social-icon svg { width: 100%; height: 100%; display: block; }

  .signature {
    position: absolute;
    left: 92%;
    bottom: 4%;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    animation: sig-appear 3s ease-out 2s forwards;
  }
  .signature-text {
    display: inline-block;
    font-family: 'Dancing Script', 'Great Vibes', cursive;
    font-weight: 500;
    font-size: clamp(22px, 2.6vw, 38px);
    line-height: 1;
    color: rgba(168, 184, 216, 0.55);
    letter-spacing: 0.01em;
    text-shadow:
      0 0 10px rgba(150, 170, 220, 0.25),
      0 0 20px rgba(150, 170, 220, 0.10);
    clip-path: inset(0 100% 0 0);
    animation: write-in 4s cubic-bezier(0.6, 0, 0.4, 1) 2.2s forwards;
    padding: 0 4px 4px 2px;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes sig-appear {
    from { opacity: 0; filter: blur(6px); transform: translateX(5px); }
    to   { opacity: 1; filter: blur(0);   transform: translateX(0);   }
  }
  @keyframes write-in {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 -10% 0 0); }
  }

  .girl-wrap {
    position: absolute;
    left: 30%; bottom: 0;
    height: 70vh;
    margin-right: 20px;
    z-index: 4;
    pointer-events: none;
    transform-origin: 50% 100%;
    will-change: transform;
    animation: alive-girl 11s ease-in-out infinite;
  }
  .girl {
    height: 100%; width: auto; display: block;
    object-fit: contain; user-select: none;
    filter: brightness(0.72) saturate(0.55) contrast(1.05);
  }
  @keyframes alive-girl {
    0%, 100% { transform: translateY(0)     rotate(0deg)     scale(1); }
    30%      { transform: translateY(-4px)  rotate(0.4deg)   scale(1.004, 1.010); }
    60%      { transform: translateY(-6px)  rotate(0deg)     scale(1.006, 1.014); }
  }
  .girl-wrap::before {
    content: "";
    position: absolute;
    inset: -30% -45% -22% -45%;
    background: radial-gradient(
      ellipse 55% 60% at 50% 78%,
      rgba(150, 170, 220, 0.16) 0%,
      rgba(140, 160, 210, 0.10) 18%,
      rgba(130, 150, 200, 0.06) 34%,
      rgba(120, 140, 190, 0.03) 50%,
      rgba(110, 130, 180, 0.015) 66%,
      rgba(100, 120, 170, 0.005) 82%,
      rgba(100, 120, 170, 0)   100%
    );
    filter: blur(30px);
    pointer-events: none;
    z-index: -1;
    animation: glow-breathe 13s ease-in-out infinite reverse;
  }

  .roof-wrap {
    position: absolute;
    right: 0; top: 0;
    height: 60vh;
    z-index: 4;
    pointer-events: none;
    contain: layout style;
  }
  .roof {
    display: block;
    height: 100%; width: auto;
    object-fit: contain;
    user-select: none;
    filter: brightness(0.55) saturate(0.5) contrast(1.05);
  }
  .roof-wrap::before {
    content: "";
    position: absolute;
    inset: -25% -35% -15% -35%;
    background: radial-gradient(
      ellipse 55% 60% at 55% 35%,
      rgba(150, 170, 220, 0.12) 0%,
      rgba(140, 160, 210, 0.08) 20%,
      rgba(130, 150, 200, 0.05) 38%,
      rgba(120, 140, 190, 0.03) 55%,
      rgba(110, 130, 180, 0.015) 72%,
      rgba(100, 120, 170, 0.005) 86%,
      rgba(100, 120, 170, 0)    100%
    );
    filter: blur(35px);
    pointer-events: none;
    z-index: -1;
    animation: tree-glow 15s ease-in-out infinite;
  }
  @keyframes tree-glow {
    0%, 100% { opacity: 0.5; }
    45%      { opacity: 0.8; }
    70%      { opacity: 0.6; }
  }

  .block {
    height: 100%; position: absolute; width: 50%; right: 0; z-index: 4;
    display: flex; flex-direction: row; justify-content: flex-end; align-items: flex-end;
    pointer-events: none;
  }

  /* Haiku — soft, cold, quiet */
  .haiku {
    position: absolute; top: 5dvh; left: 80px;
    writing-mode: vertical-rl; text-orientation: mixed;
    font-size: 32px; line-height: 2.2;
    color: #c8d0e8;
    letter-spacing: 0.08em;
    text-shadow:
      0 0 14px rgba(150, 170, 220, 0.4),
      0 0 30px rgba(100, 120, 180, 0.2);
    font-weight: 400;
    user-select: none;
    z-index: 6;
    opacity: 0.9;
    animation: haiku-sway 13s ease-in-out infinite;
  }
  @keyframes haiku-sway {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1;    }
  }

  .yt-wrap {
    position: absolute; top: calc(5dvh + 270px); left: 80px; z-index: 6;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 0 16px; height: 40px; border-radius: 999px;
    background: rgba(12, 16, 30, 0.85);
    border: 1px solid rgba(150, 170, 220, 0.18);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 13px; font-weight: 500; color: #c8d0e8;
    letter-spacing: 0.04em; user-select: none; pointer-events: none; white-space: nowrap;
  }
  .yt-icon { display: inline-flex; width: 16px; height: 16px; color: #a8b8d8; flex-shrink: 0; }
  .yt-icon svg { width: 100%; height: 100%; display: block; }
  .yt-text.error { color: #d89d9d; }

  #hiddenAudio {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
    top: -10px; left: -10px;
  }

  /* ============================================================
     START OVERLAY — tap to begin
     ============================================================ */
  .start-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(circle at 50% 50%,
      rgba(6, 8, 16, 0.82) 0%,
      rgba(3, 4, 10, 0.94) 70%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    transition: opacity 1s ease, visibility 1s ease;
    text-align: center;
    padding: 20px;
  }
  .start-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .start-poem {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(13px, 2.2vw, 16px);
    color: rgba(168, 184, 216, 0.55);
    letter-spacing: 0.28em;
    line-height: 2;
    margin-bottom: 6px;
    font-weight: 400;
  }

  .start-text {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(18px, 3vw, 24px);
    color: #c8d0e8;
    letter-spacing: 0.32em;
    padding: 20px 40px;
    border-radius: 999px;
    background: rgba(12, 16, 30, 0.6);
    border: 1px solid rgba(150, 170, 220, 0.28);
    text-shadow:
      0 0 14px rgba(150, 170, 220, 0.5),
      0 0 30px rgba(100, 120, 180, 0.25);
    animation: pulse-hint 3.5s ease-in-out infinite;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  @keyframes pulse-hint {
    0%, 100% { opacity: 0.65; transform: scale(1);      }
    50%      { opacity: 1;    transform: scale(1.035);  }
  }

  .start-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right,
      transparent,
      rgba(150, 170, 220, 0.5),
      transparent);
    margin: 4px 0;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 900px) {
    .haiku { font-size: 24px; line-height: 2; left: 44px; }
    .yt-wrap { top: calc(5dvh + 205px); left: 44px; height: 34px; padding: 0 13px; font-size: 12px; gap: 7px; }
    .yt-icon { width: 14px; height: 14px; }
    .person-wrap { height: 44vh; }
    .girl-wrap   { height: 60vh; }
    .roof-wrap   { height: 52vh; }
    .left-stack { margin-bottom: 12px; gap: 10px; }
    .eq { height: 38px; padding: 0 13px; gap: 8px; }
    .eq-label { font-size: 13px; }
    #equalizer { width: 90px; height: 20px; }
    .socials { gap: 6px; }
    .social  { font-size: 12px; padding: 4px 10px 4px 7px; gap: 6px; }
    .social-icon { width: 14px; height: 14px; }
    .person-wrap::before, .girl-wrap::before { filter: blur(22px); }
    .roof-wrap::before { filter: blur(26px); }
    .signature-text { font-size: clamp(20px, 3.2vw, 32px); }
  }

  @media (max-width: 700px) {
    .haiku { font-size: 18px; line-height: 1.9; top: 3dvh; left: 14px; }
    .yt-wrap { top: calc(3dvh + 150px); left: 14px; height: 28px; padding: 0 11px; font-size: 10px; gap: 6px; }
    .yt-icon { width: 12px; height: 12px; }
    .person-wrap { height: 32vh; right: 45%; }
    .girl-wrap   { height: 44vh; left: 30%; margin-right: 0; }
    .roof-wrap   { height: 22vh; }
    .left-stack { margin-bottom: 10px; gap: 8px; }
    .eq { height: 30px; padding: 0 10px; gap: 6px; }
    .eq-label { font-size: 10px; }
    #equalizer { width: 60px; height: 14px; }
    .socials { gap: 4px; }
    .social { font-size: 9px; padding: 3px 8px 3px 5px; gap: 4px; }
    .social-icon { width: 11px; height: 11px; }
    .person-wrap::before, .girl-wrap::before { filter: blur(18px); }
    .roof-wrap::before { filter: blur(20px); }
    .signature { bottom: 3%; }
    .signature-text { font-size: clamp(18px, 4.5vw, 26px); }
  }

  @media (max-width: 400px) {
    .haiku { font-size: 16px; }
    .person-wrap { height: 30vh; }
    .girl-wrap   { height: 40vh; }
    .roof-wrap   { height: 20vh; }
    .yt-wrap { font-size: 9px; padding: 0 9px; height: 24px; }
    .left-stack { margin-bottom: 8px; gap: 6px; }
    .eq { height: 26px; padding: 0 8px; }
    #equalizer { width: 52px; height: 12px; }
    .social { font-size: 8px; padding: 3px 6px 3px 4px; }
    .social-icon { width: 10px; height: 10px; }
    .signature-text { font-size: 16px; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .haiku { font-size: 16px; line-height: 1.7; top: 8px; left: 14px; }
    .yt-wrap { top: calc(8px + 130px); left: 14px; }
    .person-wrap { height: 72vh; }
    .girl-wrap   { height: 88vh; }
    .roof-wrap   { height: 70vh; }
    .left-stack { margin-bottom: 10px; gap: 8px; }
    .eq { height: 30px; padding: 0 10px; }
    #equalizer { width: 60px; height: 14px; }
    .socials { gap: 4px; }
    .social { font-size: 9px; padding: 3px 7px 3px 5px; gap: 4px; }
    .social-icon { width: 11px; height: 11px; }
    .signature-text { font-size: clamp(18px, 2.6vw, 24px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .person-wrap, .girl-wrap, .haiku, body::before { animation: none; }
    .person-wrap::before, .girl-wrap::before,
    .roof-wrap::before { animation: none; opacity: 0.7; }
    .signature, .signature-text { animation: none; opacity: 1; filter: none; clip-path: none; }
    .start-text { animation: none; }
  }
</style>
</head>
<body>

<!-- Audio -->
<audio id="hiddenAudio" preload="auto" loop></audio>

<!-- Rain streaks — behind petals -->
<canvas id="rain"></canvas>

<!-- Falling petals -->
<canvas id="petals"></canvas>

<!-- Mist at bottom -->
<div class="mist"></div>

<div class="haiku" lang="jp">
  花は散り<br>
  名を覚えている<br>
  風ばかり
</div>

<div class="yt-wrap">
  <span class="yt-icon">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
    </svg>
  </span>
  <span class="yt-text" id="ytLabel">loading…</span>
</div>

<div class="person-wrap">
  <img class="person" id="personImg"
       src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/person.png"
       alt="man">

  <div class="left-stack">
    <div class="eq">
      <span class="eq-label">音</span>
      <canvas id="equalizer" width="220" height="48"></canvas>
    </div>

    <div class="socials" aria-label="social links">
      <a class="social" href="https://youtube.com/@pratrxx" target="_blank" rel="noopener">
        <span class="social-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg></span>
        <span class="social-label">@pratrxx</span>
      </a>
      <a class="social" href="https://github.com/pratrx" target="_blank" rel="noopener">
        <span class="social-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5 3.3 9.3 7.8 10.8.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.8 2.7 1.3 3.4 1 .1-.7.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.5 11.5 0 0 0 23.5 12C23.5 5.7 18.3.5 12 .5Z"/></svg></span>
        <span class="social-label">pratrx</span>
      </a>
      <a class="social" href="https://youtu.be/mTvhaPzatdU?si=Z4_q0_roAY5Blk3y" target="_blank" rel="noopener">
        <span class="social-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg></span>
        <span class="social-label">@pratrxx</span>
      </a>
    </div>
  </div>

  <div class="signature" aria-hidden="true">
    <span class="signature-text">pratrxx</span>
  </div>
</div>

<div class="block">
  <div class="girl-wrap">
    <img class="girl" id="girlImg"
         src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/girl.png"
         alt="girl">
  </div>
  <div class="roof-wrap">
    <img src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/bg.png"
         alt="roof" class="roof" id="roofImg">
  </div>
</div>

<!-- ============================================================
     TAP TO BEGIN overlay
     ============================================================ -->
<div class="start-overlay" id="startOverlay">
  <div class="start-poem">
    静かな夜<br>
    音が涙になる
  </div>
  <div class="start-line"></div>
  <div class="start-text">tap to begin</div>
</div>

<script>
/* ============================================================
   DEVICE TIER
   ============================================================ */
const IS_MOBILE =
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  window.innerWidth < 700;

const CORES = navigator.hardwareConcurrency || 4;
const MEM   = navigator.deviceMemory || 4;
const IS_LOW_END =
  (IS_MOBILE && (CORES <= 4 || MEM <= 3)) ||
  window.innerWidth < 380;
const IS_VERY_LOW = IS_MOBILE && (CORES <= 2 || MEM <= 2);

function pickParticleCount() {
  if (IS_VERY_LOW) return 12;
  if (IS_LOW_END)  return 20;
  if (IS_MOBILE)   return 28;
  if (window.innerWidth < 1000) return 70;
  return 110;
}

/* ============================================================
   HARD DISABLE SCROLL
   ============================================================ */
function killScroll(e) { if (e.cancelable) e.preventDefault(); }
document.addEventListener("touchmove", killScroll, { passive: false });
document.addEventListener("wheel", killScroll, { passive: false });
document.addEventListener("gesturestart", killScroll, { passive: false });
window.addEventListener("scroll", () => { window.scrollTo(0, 0); }, { passive: true });

/* ============================================================
   PNG PRE-DOWNSCALE
   ============================================================ */
function downscaleImg(imgEl, maxW, maxH) {
  const doIt = () => {
    try {
      const iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
      if (!iw || !ih) return;
      const scale = Math.min(maxW / iw, maxH / ih, 1);
      if (scale >= 1) return;
      const w = Math.max(1, Math.round(iw * scale));
      const h = Math.max(1, Math.round(ih * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const cx = c.getContext("2d");
      cx.imageSmoothingEnabled = true;
      cx.imageSmoothingQuality = "high";
      cx.drawImage(imgEl, 0, 0, w, h);
      imgEl.src = c.toDataURL("image/png");
    } catch (e) {}
  };
  if (imgEl.complete && imgEl.naturalWidth) doIt();
  else imgEl.addEventListener("load", doIt, { once: true });
}
(function preloadAndDownscale() {
  const capDesktop = { p: 900,  g: 1200, r: 1000 };
  const capMobile  = { p: 500,  g: 650,  r: 550  };
  const capLow     = { p: 400,  g: 500,  r: 450  };
  const cap = IS_VERY_LOW ? capLow : (IS_MOBILE ? capMobile : capDesktop);
  downscaleImg(document.getElementById("personImg"), cap.p, cap.p);
  downscaleImg(document.getElementById("girlImg"),   cap.g, cap.g);
  downscaleImg(document.getElementById("roofImg"),   cap.r, cap.r);
})();

/* ============================================================
   RAIN — subtle sad streaks falling diagonally
   ============================================================ */
(function initRain() {
  const rainCanvas = document.getElementById("rain");
  const rCtx = rainCanvas.getContext("2d", { alpha: true });
  let w = 0, h = 0;
  let drops = [];

  function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    rainCanvas.width = w;
    rainCanvas.height = h;
    const count = IS_VERY_LOW ? 30 : IS_LOW_END ? 50 : IS_MOBILE ? 70 : 120;
    drops = [];
    for (let i = 0; i < count; i++) {
      drops.push({
        x: Math.random() * w,
        y: Math.random() * h,
        len: 8 + Math.random() * 14,
        speed: 180 + Math.random() * 160,
        alpha: 0.06 + Math.random() * 0.14,
        thickness: 0.5 + Math.random() * 0.7
      });
    }
  }
  resize();
  window.addEventListener("resize", resize);

  let last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) { last = now; return; }
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    rCtx.clearRect(0, 0, w, h);
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      rCtx.strokeStyle = `rgba(180, 200, 240, ${d.alpha})`;
      rCtx.lineWidth = d.thickness;
      rCtx.beginPath();
      rCtx.moveTo(d.x, d.y);
      rCtx.lineTo(d.x - d.len * 0.25, d.y + d.len);
      rCtx.stroke();

      d.y += d.speed * dt;
      d.x -= d.speed * 0.25 * dt;
      if (d.y > h + 20) {
        d.y = -20 - Math.random() * 40;
        d.x = Math.random() * w + 40;
      }
      if (d.x < -40) d.x = w + 20;
    }
  }
  requestAnimationFrame(loop);
})();

/* ============================================================
   AUDIO — BLOB PREFETCH + AUTOPLAY
   ============================================================ */
const FADE_SECONDS = 5;
const START_SECONDS = 67;
const AUDIO_URL =
  "https://youtu.be/26pzKx3y6TU?si=WAweQfp02R29EBT6";

const audioEl = document.getElementById("hiddenAudio");
const audioState = { bass: 0, mid: 0, treble: 0, beat: 0, active: false };
let audioBlobURL = null;
let audioReady = false;
let pendingAutoplay = false;

const ytLabel = document.getElementById("ytLabel");
function setLabel(text, isError) {
  ytLabel.textContent = text;
  ytLabel.classList.toggle("error", !!isError);
}

/* Prefetch MP3 as blob on page load */
(function prefetchAudio() {
  setLabel("loading…");
  fetch(AUDIO_URL, { cache: "force-cache" })
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.blob();
    })
    .then(blob => {
      audioBlobURL = URL.createObjectURL(blob);
      audioEl.src = audioBlobURL;
      audioEl.load();
      audioReady = true;
      setLabel("ready");
      if (pendingAutoplay) { pendingAutoplay = false; tryAutoplay(); }
    })
    .catch(err => {
      console.warn("Blob prefetch failed, falling back:", err);
      audioEl.src = AUDIO_URL;
      audioEl.load();
      audioReady = true;
      setLabel("ready");
      if (pendingAutoplay) { pendingAutoplay = false; tryAutoplay(); }
    });
})();

/* Volume fade */
let volumeFadeInterval = null;
function fadeVolume(setVol, onDone) {
  if (volumeFadeInterval) clearInterval(volumeFadeInterval);
  const steps = FADE_SECONDS * 10;
  const stepMs = (FADE_SECONDS * 1000) / steps;
  let step = 0;
  setVol(0);
  volumeFadeInterval = setInterval(() => {
    step++;
    setVol(Math.min(100, Math.round((step / steps) * 100)));
    if (step >= steps) {
      clearInterval(volumeFadeInterval);
      volumeFadeInterval = null;
      setLabel("now playing");
      if (onDone) onDone();
    }
  }, stepMs);
}

/* Simulated beat engine — slower, melancholic */
function startBeatEngine() {
  let lastBeat = 0;
  function tick() {
    requestAnimationFrame(tick);
    if (!audioState.active) return;
    const t = performance.now();
    const bassEnv = 0.45 + Math.sin(t * 0.0012) * 0.18;
    if (t - lastBeat > 560) {   /* slower beat = sadder */
      audioState.beat = 0.45 + Math.random() * 0.3;
      lastBeat = t;
    }
    audioState.bass   = bassEnv + audioState.beat * 0.25;
    audioState.mid    = 0.32 + Math.sin(t * 0.0035) * 0.14 + Math.random() * 0.04;
    audioState.treble = 0.20 + Math.random() * 0.16;
    audioState.beat  *= 0.87;
  }
  requestAnimationFrame(tick);
}

audioEl.addEventListener("loadedmetadata", () => {
  try {
    if (audioEl.duration > START_SECONDS && audioEl.currentTime < 60) {
      audioEl.currentTime = START_SECONDS;
    }
  } catch (e) {}
});

let autoplayStarted = false;
function tryAutoplay() {
  if (autoplayStarted) return;
  autoplayStarted = true;

  audioEl.muted = false;
  audioEl.volume = 0;

  const p = audioEl.play();
  if (p && p.then) {
    p.then(() => {
      onStarted();
      fadeVolume(v => { audioEl.volume = v / 100; });
    }).catch(() => {
      audioEl.muted = true;
      audioEl.volume = 1;
      const p2 = audioEl.play();
      if (p2 && p2.then) {
        p2.then(() => { onStarted(); setLabel("tap for sound"); })
          .catch(() => { autoplayStarted = false; setLabel("tap to play"); });
      }
    });
  } else {
    onStarted();
    audioEl.volume = 1;
  }
}

function onStarted() {
  audioState.active = true;
  startBeatEngine();
}

function boot() {
  if (audioReady) {
    tryAutoplay();
  } else {
    pendingAutoplay = true;
    setTimeout(() => {
      if (!audioReady) {
        audioEl.src = AUDIO_URL;
        audioEl.load();
        audioReady = true;
        if (pendingAutoplay) { pendingAutoplay = false; tryAutoplay(); }
      }
    }, 2000);
  }
}

if (audioEl.readyState >= 1) setTimeout(boot, 0);
else {
  audioEl.addEventListener("loadedmetadata", boot, { once: true });
  setTimeout(() => { if (!autoplayStarted && audioReady) boot(); }, 500);
}

/* ============================================================
   START OVERLAY — tap to begin
   ============================================================ */
const overlay = document.getElementById("startOverlay");
let userTapped = false;

function beginExperience() {
  if (userTapped) return;
  userTapped = true;

  overlay.classList.add("hidden");

  /* Unmute + start playback if it wasn't already */
  audioEl.muted = false;
  if (audioEl.paused) audioEl.play().catch(() => {});
  audioState.active = true;
  startBeatEngine();

  if (audioEl.volume < 0.01) {
    audioEl.volume = 0;
    fadeVolume(v => { audioEl.volume = v / 100; });
  } else {
    setLabel("now playing");
  }
}

overlay.addEventListener("pointerdown", beginExperience, { once: true });
overlay.addEventListener("touchstart", beginExperience, { once: true, passive: true });
overlay.addEventListener("click", beginExperience, { once: true });
overlay.addEventListener("wheel", e => e.preventDefault(), { passive: false });
overlay.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

/* ============================================================
   FALLING PETALS — slower, melancholic drift
   ============================================================ */
const petalCanvas = document.getElementById("petals");
const pCtx = petalCanvas.getContext("2d", { alpha: true });
let pWidth = 0, pHeight = 0;
let petals = [];

const FLIP_FRAMES = 12;
const PETAL_SIZE = 64;

function buildFlipFrames() {
  const frames = [];
  const base = document.createElement("canvas");
  base.width = base.height = PETAL_SIZE;
  {
    const t = base.getContext("2d");
    const cx = PETAL_SIZE/2, cy = PETAL_SIZE/2;

    const glow = t.createRadialGradient(cx, cy, 0, cx, cy, PETAL_SIZE * 0.5);
    glow.addColorStop(0,    "rgba(220, 200, 220, 0.40)");
    glow.addColorStop(0.55, "rgba(190, 170, 200, 0.12)");
    glow.addColorStop(1,    "rgba(180, 160, 200, 0)");
    t.fillStyle = glow;
    t.fillRect(0, 0, PETAL_SIZE, PETAL_SIZE);

    const sc = (PETAL_SIZE / 128) * 1.55;
    t.translate(cx, cy);
    t.scale(sc, sc);
    t.translate(-32, -32);

    /* Muted petal — desaturated, pale */
    t.beginPath();
    t.moveTo(32, 5);
    t.quadraticCurveTo(5, 32, 32, 59);
    t.quadraticCurveTo(59, 32, 32, 5);
    const grad = t.createLinearGradient(32, 5, 32, 59);
    grad.addColorStop(0,   "#e8dde2");
    grad.addColorStop(0.5, "#d4b8c4");
    grad.addColorStop(1,   "#b89aad");
    t.fillStyle = grad;
    t.fill();
    t.strokeStyle = "rgba(220, 210, 225, 0.7)";
    t.lineWidth = 1.3;
    t.stroke();

    t.beginPath();
    t.moveTo(32, 5); t.lineTo(32, 59);
    t.strokeStyle = "rgba(230, 220, 230, 0.55)";
    t.lineWidth = 1;
    t.stroke();
  }

  for (let i = 0; i < FLIP_FRAMES; i++) {
    const phase = (i / FLIP_FRAMES) * Math.PI * 2;
    const squash = Math.max(0.10, Math.abs(Math.cos(phase)));

    const c = document.createElement("canvas");
    c.width = c.height = PETAL_SIZE;
    const t = c.getContext("2d");
    t.translate(PETAL_SIZE/2, PETAL_SIZE/2);
    t.scale(squash, 1);
    t.drawImage(base, -PETAL_SIZE/2, -PETAL_SIZE/2);
    frames.push(c);
  }
  return frames;
}
const petalFrames = buildFlipFrames();

/* Slower, sadder physics */
const S = {
  minSize: 10, maxSize: 28,
  windMin: 20, windMax: 65,          // slower wind
  gravity: 9,                         // gentler gravity
  turbulenceFreq: 0.22,               // slower flutter
  turbulenceAmp: 16,
  beatBoost: 1.0,
  direction: -1,
  count: pickParticleCount()
};

class Petal {
  constructor(init = false) {
    this.audioSens = 0.5 + Math.random() * 0.5;
    this.beatSens  = 0.5 + Math.random() * 0.5;
    this.gust = 1;
    this.reset(init);
  }
  reset(init = false) {
    this.width = S.minSize + Math.random() * (S.maxSize - S.minSize);
    this.halfW = this.width / 2;
    const sf = (this.width - S.minSize) / (S.maxSize - S.minSize || 1);

    this.weight = sf;
    this.windTarget = S.windMin + (1 - sf) * (S.windMax - S.windMin);
    this.gravityMul = 0.7 + sf * 0.9;

    this.y = -30 - Math.random() * pHeight * 0.4;
    if (init) {
      this.y = Math.random() * pHeight;
      this.x = Math.random() * pWidth;
    } else {
      this.x = S.direction === -1
        ? pWidth + this.width + Math.random() * pWidth * 0.5
        : -this.width - Math.random() * pWidth * 0.5;
    }

    this.vx = this.windTarget * 0.3;
    this.vy = 15 + Math.random() * 20;

    this.phase1 = Math.random() * Math.PI * 2;
    this.phase2 = Math.random() * Math.PI * 2;
    this.swayAmp = 0.5 + Math.random() * 0.7;

    this.flipPhase = Math.random() * FLIP_FRAMES;
    this.flipSpeed = 0.25 + Math.random() * 0.55;   /* slower flip */
  }

  update(dt, now) {
    const windK = 1 - Math.exp(-1.4 * dt);
    this.vx += (this.windTarget - this.vx) * windK;
    this.vy += S.gravity * this.gravityMul * dt;

    const flutter =
      Math.sin(now * S.turbulenceFreq * Math.PI * 2 + this.phase1) * S.turbulenceAmp * this.swayAmp +
      Math.sin(now * S.turbulenceFreq * 5.2 + this.phase2) * S.turbulenceAmp * 0.35;
    this.vy += flutter * dt;

    const dragX = Math.exp(-1.8 * dt);
    const dragY = Math.exp(-1.1 * dt);
    this.vx *= dragX;
    this.vy *= dragY;

    if (this.vy > 55) this.vy = 55;   /* slower terminal velocity */

    let gustTarget = 1;
    if (audioState.active) {
      const s = this.audioSens;
      gustTarget += audioState.bass * 0.6 * s;
      gustTarget += audioState.mid  * 0.15 * s;
      gustTarget += audioState.beat * S.beatBoost * this.beatSens;
    }
    this.gust += (gustTarget - this.gust) * (1 - Math.exp(-4 * dt));

    this.x += this.vx * S.direction * this.gust * dt;
    this.y += this.vy * this.gust * dt;

    const speedFactor = 1 + Math.min(1.5, Math.abs(this.vx) / 60);
    this.flipPhase += this.flipSpeed * speedFactor * dt;
    if (this.flipPhase >= FLIP_FRAMES) this.flipPhase -= FLIP_FRAMES;

    const b = 120;
    const outByX = S.direction === -1 ? this.x < -b : this.x > pWidth + b;
    if (outByX || this.y > pHeight + b || this.y < -b) this.reset(false);
  }

  draw() {
    const f0 = Math.floor(this.flipPhase) % FLIP_FRAMES;
    const f1 = (f0 + 1) % FLIP_FRAMES;
    const alpha = this.flipPhase - Math.floor(this.flipPhase);

    const px = this.x - this.halfW;
    const py = this.y - this.halfW;

    pCtx.globalAlpha = (1 - alpha) * 0.85;
    pCtx.drawImage(petalFrames[f0], px, py, this.width, this.width);

    if (alpha > 0.02) {
      pCtx.globalAlpha = alpha * 0.85;
      pCtx.drawImage(petalFrames[f1], px, py, this.width, this.width);
    }
    pCtx.globalAlpha = 1;
  }
}

function pResize() {
  pWidth  = window.innerWidth;
  pHeight = window.innerHeight;
  petalCanvas.width  = pWidth;
  petalCanvas.height = pHeight;
}
function initPetals() {
  petals = [];
  for (let i = 0; i < S.count; i++) {
    const p = new Petal(false);
    p.x -= Math.random() * pWidth * 1.0;
    p.y = Math.random() * pHeight;
    petals.push(p);
  }
}
let paused = false;
let lastTime = 0;

function pLoop(now) {
  requestAnimationFrame(pLoop);
  if (paused) { lastTime = now; return; }

  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  const tSec = now * 0.001;

  pCtx.clearRect(0, 0, pWidth, pHeight);
  for (let i = 0; i < petals.length; i++) {
    const p = petals[i];
    p.update(dt, tSec);
    p.draw();
  }
}
pResize();
initPetals();
requestAnimationFrame(pLoop);
window.addEventListener("resize", () => { pResize(); sizeEqCanvas(); });
window.addEventListener("orientationchange", () => setTimeout(() => { pResize(); sizeEqCanvas(); }, 150));

document.addEventListener("visibilitychange", () => { paused = document.hidden; });

/* ============================================================
   EQUALIZER — muted, cold tone
   ============================================================ */
const eqCanvas = document.getElementById("equalizer");
const eqCtx = eqCanvas.getContext("2d");
const BAR_COUNT = IS_VERY_LOW ? 8 : (IS_MOBILE ? 12 : 22);

function sizeEqCanvas() {
  const r = eqCanvas.getBoundingClientRect();
  eqCanvas.width  = Math.max(1, Math.floor(r.width));
  eqCanvas.height = Math.max(1, Math.floor(r.height));
}
sizeEqCanvas();

let eqTick = 0;
function drawEq(t) {
  const W = eqCanvas.width, H = eqCanvas.height;
  eqCtx.clearRect(0, 0, W, H);
  const barW = (W / BAR_COUNT) * 0.7;
  const gap  = (W - barW * BAR_COUNT) / (BAR_COUNT - 1);
  for (let i = 0; i < BAR_COUNT; i++) {
    let v;
    if (audioState.active) {
      const pos = i / BAR_COUNT;
      const bs = Math.max(0, 1 - pos * 2) * audioState.bass;
      const ms = Math.max(0, 1 - Math.abs(pos - 0.5) * 2.5) * audioState.mid;
      const ts = Math.max(0, pos * 1.5 - 0.5) * audioState.treble;
      v = Math.min(1, bs + ms + ts);
    } else {
      const phase = t * 0.002 + i * 0.35;
      v = (Math.sin(phase) * 0.5 + 0.5) * 0.7 + 0.15;
    }
    const h = v * H;
    const x = i * (barW + gap);
    /* Cool blue-gray bars */
    eqCtx.fillStyle = `rgba(168, 184, 216, ${0.30 + v * 0.55})`;
    eqCtx.fillRect(x, H - h, barW, h);
  }
}
function eqLoop(t) {
  eqTick++;
  const eqSkip = IS_VERY_LOW ? 3 : (IS_MOBILE ? 2 : 1);
  if (!paused && (eqTick % eqSkip === 0)) drawEq(t);
  requestAnimationFrame(eqLoop);
}
requestAnimationFrame(eqLoop);
</script>
